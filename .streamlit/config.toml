[server]
# A face photo needs nowhere near this. The Streamlit default is 200 MB,
# which lets one visitor push very large images into the CV pipeline and
# hang the app, so it is capped aggressively here.
maxUploadSize = 10
maxMessageSize = 20
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[client]
# Do not leak Python tracebacks to visitors on a public deployment.
showErrorDetails = false
